<!DOCTYPE html>
<html>

<head>
    <title>Chat UI</title>
<style>
    /* RESET PAGE SCROLL */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ece5dd;

  height: 100vh;
  overflow: hidden; /* 🔥 stops full page scroll */

  display: flex;
  justify-content: center;
  align-items: center;
}

/* CHAT WRAPPER (adds margin around) */
.chat-wrapper {
  padding: 20px; /* 🔥 outer spacing */
}

/* MAIN CONTAINER */
.chat-container {
  width: 350px;
  height: 80vh;
 max-height: 100%;
  background: #fff;

  display: flex;
  flex-direction: column;

  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);

}

/* HEADER (always visible) */
.chat-header {
  background: #075e54;
  color: white;
  padding: 15px;
  font-size: 18px;

  flex-shrink: 0; /* 🔥 prevents hiding */
}

/* SCROLLABLE CHAT AREA */
.chat-box {
  flex: 1;
  padding: 10px;
  background: #e5ddd5;

  overflow-y: auto; /* 🔥 scroll only here */

  display: flex;
  flex-direction: column;
}

/* MESSAGES */
.message {
  max-width: 70%;
  padding: 8px 12px;
  margin: 6px 0;
  border-radius: 8px;
  font-size: 14px;
}

.sent {
  background: #dcf8c6;
  align-self: flex-end;
}

.received {
  background: #fff;
  align-self: flex-start;
}

/* INPUT (fixed bottom) */
.chat-input {
  display: flex;
  padding: 10px;
  background: #f0f0f0;

  flex-shrink: 0; /* 🔥 stays visible */
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  outline: none;
}

.chat-input button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #25d366;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}
#activeUsers {
  /* padding: 8px;
  background: #f0f0f0; */
  font-size: 14px;
}

#typing {
  padding-left: 10px;
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

    <h3>


    </h3>

    <div class="chat-wrapper">
                        
  <div class="chat-container">
    <div class="chat-header">Chat
        <div id="activeUsers"></div>
<div id="typing"></div>

    </div>
    <div id="activeUsers"></div>


    <div class="chat-box" id="chatBox"></div>

    <div class="chat-input">
      <input id="messageInput" placeholder="Type a message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

<script>
const socket = io("http://localhost:3000");

const username = prompt("Enter your name");

if (!username) {
    alert("Username required!");
}

// DOM
const input = document.getElementById("messageInput");
const chatBox = document.getElementById("chatBox");
const btn = document.getElementById("send-btn");
const activeUsersDiv = document.getElementById("activeUsers");
const typingDiv = document.getElementById("typing");

// JOIN
socket.emit("join", username);

// LOAD OLD MESSAGES
socket.on("load_messages", (messages) => {

    chatBox.innerHTML = "";

    messages.forEach(msg => {
        addMessage(msg.username, msg.message);
    });

    scrollToBottom();
});

// RECEIVE MESSAGE
socket.on("broadcast_message", (data) => {
    addMessage(data.username, data.text);
});

// ACTIVE USERS
socket.on("active_users", (users) => {

    activeUsersDiv.innerHTML =
        "🟢" + users.join(", ");
});

// TYPING
socket.on("typing", (user) => {

    typingDiv.innerText = user + " is typing...";

    setTimeout(() => {
        typingDiv.innerText = "";
    }, 1000);
});

// SEND MESSAGE
btn.addEventListener("click", () => {

    const message = input.value.trim();

    if (!message) return;

    socket.emit("new_message", {
        text: message
    });

    input.value = "";
});

// ENTER KEY
input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
        btn.click();
    }
});

// TYPING EVENT
input.addEventListener("input", () => {
    socket.emit("typing");
});

// ADD MESSAGE FUNCTION
function addMessage(user, text) {

    const div = document.createElement("div");

    if (user === username) {
        div.classList.add("message", "sent");
    } else {
        div.classList.add("message", "received");
    }

    div.innerText = user + ": " + text;

    chatBox.appendChild(div);

    scrollToBottom();
}

// AUTO SCROLL
function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>

</html>
